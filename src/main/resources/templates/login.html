
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Luxe Jewels</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">✦</div>
        <h1>LUXE JEWELS</h1>
        <p class="subtitle">Jewelry Management System</p>

        <h2>Admin Login</h2>
        <p class="welcome">Welcome back! Please sign in.</p>

        <div class="message error" th:if="${param.error}">
            Invalid username or password.
        </div>

        <div class="message success" th:if="${param.logout}">
            You have logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">



    <label>Username</label>
    <input type="text" name="username"
           placeholder="Enter admin username" required>

    <label>Password</label>
    <input type="password" name="password"
           placeholder="Enter password" required>

    <button type="submit">SIGN IN</button>

</form>

        <p class="footer">© 2026 Luxe Jewels. All rights reserved.</p>

    </div>
</div>

</body>
</html>
