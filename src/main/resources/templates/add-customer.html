
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; padding: 30px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box; }
        button, a { padding: 10px 18px; background: #b8860b; color: white; border: none; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">

    <h1 th:text="${customer.id == null ? 'Add New Customer' : 'Edit Customer'}"></h1>

    <form th:action="${customer.id == null} ? @{/customers/save} : @{/customers/update}"
          th:object="${customer}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Customer Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Phone Number</label>
        <input type="text" th:field="*{phone}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}">

        <label>Address</label>
        <textarea th:field="*{address}"></textarea>

        <button type="submit">Save Customer</button>
    </form>

    <br><br>
    <a th:href="@{/customers}">Back to Customers</a>

</div>
</body>
</html>
