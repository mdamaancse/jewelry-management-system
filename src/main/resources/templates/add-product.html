
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jewelry Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button, a {
            padding: 10px 18px;
            background: #b8860b;
            color: white;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <h1 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}"></h1>

    <form th:action="${product.id == null} ? @{/products/save} : @{/products/update}"
          th:object="${product}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Product Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Category</label>
        <input type="text" th:field="*{category}">

        <label>Price (INR)</label>
        <input type="number" step="0.01" min="0" th:field="*{price}" required>

        <label>Weight (grams)</label>
        <input type="number" step="0.01" min="0" th:field="*{weight}" required>

        <label>Stock</label>
        <input type="number" min="0" th:field="*{stock}" required>

        <button type="submit">Save Product</button>

    </form>

    <br><br>
    <a th:href="@{/products}">Back to Products</a>

</div>

</body>
</html>
